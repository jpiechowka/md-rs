[package]
name = "md-rs"
version = "0.1.0"
edition = "2024"
authors = ["Janusz Piechówka"]
repository = "https://github.com/jpiechowka/md-rs"
license = "MIT OR Apache-2.0"
readme = "README.md"

[profile.release]
codegen-units = 1
panic = "abort"
lto = true
strip = true

[dependencies]
md-rs-macros = { path = "macros" }
windows = { version = "0.62.0", features = [
    "Win32_System_LibraryLoader",
    "Win32_Networking_WinSock",
    "Win32_System_Memory"
] }

[dev-dependencies]
proptest = "1.7.0"
